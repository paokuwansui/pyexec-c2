[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyexec2"
version = "0.1.0"
description = "PyExec2 plugin-first C2 rebuild"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pytest-asyncio>=0.23"]

[tool.setuptools]
packages = ["server_core", "server_plugins", "transport_plugins", "implant_plugins"]
include-package-data = true

[tool.setuptools.package-data]
implant_plugins = ["common/*.py", "linux/*.py", "windows/*.py"]
server_plugins = ["*.py"]
transport_plugins = ["*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
